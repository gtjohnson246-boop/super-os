<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>super-os</title>
    <style>
        body {
            background-color: #0c0c0c;
            color: #cccccc;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            font-size: 14px;
            line-height: 1.4;
        }
        #terminal-output {
            white-space: pre-wrap;
            margin-bottom: 10px;
        }
        #input-line {
            display: flex;
            align-items: center;
        }
        #prompt {
            color: #00ff00;
            white-space: pre;
            margin-right: 5px;
        }
        #user-input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-family: inherit;
            font-size: inherit;
            flex-grow: 1;
            outline: none;
            padding: 0;
        }
        .hidden {
            display: none !important;
        }
        .terminal-media {
            max-width: 450px;
            max-height: 300px;
            display: block;
            margin: 10px 0;
            border: 1px solid #333;
            border-radius: 4px;
        }
        /* Interactive Application Window */
        #app-modal {
            position: fixed;
            top: 5%;
            left: 5%;
            width: 90%;
            height: 90%;
            background-color: #000000;
            border: 2px solid #00ff00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }
        #app-header {
            background: #111;
            color: #00ff00;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #00ff00;
        }
        #close-btn {
            background: #ff3333;
            color: #ffffff;
            border: none;
            padding: 4px 10px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
        }
        #close-btn:hover {
            background: #cc0000;
        }
        #app-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div id="terminal-output"></div>
    <div id="input-line">
        <span id="prompt"></span>
        <input type="text" id="user-input" autofocus autocomplete="off" spellcheck="false">
    </div>

    <!-- Application Modal Window -->
    <div id="app-modal" class="hidden">
        <div id="app-header">
            <span id="app-title">Application Window</span>
            <button id="close-btn" onclick="closeApp()">X Close</button>
        </div>
        <iframe id="app-frame" src=""></iframe>
    </div>

    <script>
        // Prevent space bar from scrolling page when terminal is focused
        window.addEventListener("keydown", function (e) {
            if (e.key === " " || e.code === "Space" || e.keyCode === 32) {
                if (document.activeElement !== userInput) {
                    e.preventDefault();
                }
            }
        });

        // Global variables & state
        const VALID_USERNAME = "gabeee";
        const VALID_PASSWORD = "6655";
        let loginAttempts = 5;
        let isBooted = false;
        let isAuthenticated = false;
        let isEnteringPassword = false;
        let currentUsernameInput = "";

        // Virtual File System
        let currentPath = ["root"];
        const fileSystem = {
            "root": {
                type: "dir",
                children: {
                    "readme.txt": { 
                        type: "file", 
                        content: "Welcome to Mini-JS-OS! Run 'snake.exe' or '2048.exe' using the 'run' command to launch built-in apps." 
                    },
                    "snake.exe": {
                        type: "file",
                        isApp: true,
                        appUrl: "https://playsnake.org/"
                    },
                    "2048.exe": {
                        type: "file",
                        isApp: true,
                        appUrl: "https://play2048.co/"
                    },
                    "downloads": {
                        type: "dir",
                        children: {
                            "sample.txt": { 
                                type: "file", 
                                content: "This is a virtual downloaded file inside your mini-os!" 
                            }
                        }
                    }
                }
            }
        };

        const outputDiv = document.getElementById("terminal-output");
        const promptSpan = document.getElementById("prompt");
        const userInput = document.getElementById("user-input");

        function print(text = "") {
            outputDiv.textContent += text + "\n";
            window.scrollTo(0, document.body.scrollHeight);
        }

        function printMediaElement(element) {
            outputDiv.appendChild(element);
            outputDiv.appendChild(document.createTextNode("\n"));
            window.scrollTo(0, document.body.scrollHeight);
        }

        function clearTerminal() {
            outputDiv.textContent = "";
        }

        function closeApp() {
            document.getElementById("app-modal").classList.add("hidden");
            document.getElementById("app-frame").src = "";
            userInput.focus();
        }

        function getVirtualDir(pathArray) {
            let current = fileSystem;
            for (let folder of pathArray) {
                if (current[folder] && current[folder].type === "dir") {
                    current = current[folder].children;
                } else {
                    return null;
                }
            }
            return current;
        }

        function getCWDString() {
            return "/" + currentPath.slice(1).join("/");
        }

        function updatePrompt() {
            if (!isBooted || !isAuthenticated) {
                promptSpan.textContent = "";
                return;
            }
            promptSpan.textContent = `mini-os:${getCWDString()}> `;
        }

        function showBootScreen() {
            print("=".repeat(55));
            print("  __  __ _        _        ____    ____  ");
            print(" |  \\/  (_)_ __ (_)      / __ \\ / ___| ");
            print(" | |\\/| | | '_ \\| |_____| |  | |\\___ \\ ");
            print(" | |  | | | | | | |_____| |__| | ___) |");
            print(" |_|  |_|_|_| |_|_|      \\____/ |____/ ");
            print("=".repeat(55));
            print(" Mini-JS-OS Version: 1.8.0");
            print(` Host Machine Kernel : Web Browser (${navigator.platform})`);
            print(` System Time         : ${new Date().toLocaleString()}`);
            print("-".repeat(55));
            print(" Boot Sequence Completed successfully.");
            print("=".repeat(55) + "\n");
            
            isBooted = true;
            print("--- SYSTEM AUTHENTICATION REQUIRED ---");
            print("Username: ");
            userInput.type = "text";
        }

        function showLockoutScreen() {
            const tuxArt = [
                "##########**************************##########",
                "######***************%%%%%**************######",
                "###*****************#%%%#@@****************###",
                "##****************+++==+=%@*****************##",
                "#*********++++++++++*=--=%@#*+++++++*********#",
                "********++++++++++*%#::::+%%#*++++++++********",
                "******+++++++++++*%#:....+%%@#++++++++++******",
                "********+++++++++*%=::..=%%%@%++++++++********",
                "#*********++++++=*@#::::*%%%#@++++++*********#",
                "##*************+====+===+*+==*+*************##",
                "####*************++++@@@#++++++***********####",
                "######**************#%@@%++**#**********######",
                "##########**************************##########"
            ];
            
            print("\n" + "!".repeat(46));
            print(" ".repeat(14) + "SYSTEM LOCKED!");
            print(" ".repeat(7) + "Too many failed login attempts.");
            print(" ".repeat(11) + "PLEASE CONTACT OWNER.");
            print("!".repeat(46) + "\n");
            
            tuxArt.forEach(line => print(line));
            print();
            
            document.getElementById("input-line").classList.add("hidden");
            userInput.blur();
        }

        function handleAuth(input) {
            if (!isEnteringPassword) {
                currentUsernameInput = input.trim();
                print(currentUsernameInput);
                isEnteringPassword = true;
                print("Password: ");
                userInput.type = "password"; 
            } else {
                let password = input.trim();
                isEnteringPassword = false;
                userInput.type = "text";

                if (currentUsernameInput === VALID_USERNAME && password === VALID_PASSWORD) {
                    print("\nAccess Granted. Welcome back, Gabeee!\n");
                    print("Type 'help' for available commands or 'exit' to quit.\n");
                    isAuthenticated = true;
                    updatePrompt();
                } else {
                    loginAttempts--;
                    print("\n[!] Invalid credentials. Access Denied.");
                    if (loginAttempts > 0) {
                        print(`You have ${loginAttempts} attempt(s) remaining.\n`);
                        print("Username: ");
                    } else {
                        showLockoutScreen();
                    }
                }
            }
        }

        function executeCommand(commandLine) {
            print(promptSpan.textContent + commandLine);
            let trimmed = commandLine.trim();
            if (!trimmed) return;

            let parts = trimmed.split(/\s+/);
            let cmd = parts[0].toLowerCase();
            let args = parts.slice(1);

            let currentDirItems = getVirtualDir(currentPath);

            switch(cmd) {
                case "exit":
                    print("Shutting down Mini-JS-OS. Goodbye!");
                    document.getElementById("input-line").classList.add("hidden");
                    break;

                case "help":
                    print("Available commands:");
                    print("  help           - Show this help message");
                    print("  pwd            - Print current working directory");
                    print("  ls             - List files and folders");
                    print("  cd <dir>       - Change directory");
                    print("  mkdir <name>   - Create a new directory");
                    print("  cat <file>     - Read or view text, image, and video files");
                    print("  run <file>     - Launch an app or executable (.exe / .apk)");
                    print("  search_engine  - Open Google in your web browser");
                    print("  open_downloads - Import a file from your computer into /downloads");
                    print("  clear          - Clear the terminal screen");
                    print("  exit           - Exit the mini OS shell");
                    break;

                case "pwd":
                    print(getCWDString());
                    break;

                case "ls":
                    Object.keys(currentDirItems).forEach(item => {
                        let suffix = currentDirItems[item].type === "dir" ? "/" : "";
                        print("  " + item + suffix);
                    });
                    break;

                case "cd":
                    if (args.length === 0) {
                        print("Error: 'cd' requires a path argument.");
                    } else {
                        let target = args.join(" ");
                        if (target === "..") {
                            if (currentPath.length > 1) currentPath.pop();
                        } else if (currentDirItems[target] && currentDirItems[target].type === "dir") {
                            currentPath.push(target);
                        } else {
                            print(`Error: Directory '${target}' not found.`);
                        }
                    }
                    break;

                case "mkdir":
                    if (args.length === 0) {
                        print("Error: 'mkdir' requires a directory name.");
                    } else {
                        let dirName = args.join(" ");
                        if (currentDirItems[dirName]) {
                            print(`Error: '${dirName}' already exists.`);
                        } else {
                            currentDirItems[dirName] = { type: "dir", children: {} };
                            print(`Directory '${dirName}' created.`);
                        }
                    }
                    break;

                case "cat":
                    if (args.length === 0) {
                        print("Error: 'cat' requires a file name.");
                    } else {
                        let fileName = args.join(" ");
                        if (currentDirItems[fileName] && currentDirItems[fileName].type === "file") {
                            let fileData = currentDirItems[fileName];
                            
                            if (fileName.match(/\.(exe|apk)$/i) || fileData.isApp) {
                                print(`'${fileName}' is an executable file. Use 'run ${fileName}' to launch it.`);
                            } else if (fileName.match(/\.(jpeg|jpg|png|gif|webp)$/i)) {
                                print(`Displaying image '${fileName}':`);
                                let img = document.createElement("img");
                                img.src = fileData.content;
                                img.className = "terminal-media";
                                printMediaElement(img);
                            } else if (fileName.match(/\.(mp4|webm|ogg)$/i)) {
                                print(`Playing video '${fileName}':`);
                                let video = document.createElement("video");
                                video.src = fileData.content;
                                video.controls = true;
                                video.className = "terminal-media";
                                printMediaElement(video);
                            } else {
                                print(fileData.content);
                            }
                        } else {
                            print(`Error: File '${fileName}' not found.`);
                        }
                    }
                    break;

                case "run":
                    if (args.length === 0) {
                        print("Error: 'run' requires an executable file name.");
                    } else {
                        let fileName = args.join(" ");
                        let fileObj = currentDirItems[fileName];
                        
                        if (fileObj && fileObj.isApp) {
                            print(`Launching app '${fileName}'...`);
                            document.getElementById("app-title").textContent = `Running: ${fileName}`;
                            document.getElementById("app-frame").src = fileObj.appUrl;
                            document.getElementById("app-modal").classList.remove("hidden");
                        } else if (fileObj && (fileName.endsWith(".exe") || fileName.endsWith(".apk"))) {
                            print(`Executing binary setup package for '${fileName}'...`);
                            print("Status: Virtual deployment completed.");
                        } else {
                            print(`Error: '${fileName}' is not an executable application.`);
                        }
                    }
                    break;

                case "search_engine":
                    print("Opening Google in a new tab...");
                    print("Tip: Download your file, then use 'open_downloads' to load it into mini-os!");
                    window.open("https://google.com", "_blank");
                    break;

                case "open_downloads":
                    print("Opening local file picker to import a file...");
                    if ('showOpenFilePicker' in window) {
                        window.showOpenFilePicker().then(async ([fileHandle]) => {
                            try {
                                const file = await fileHandle.getFile();
                                const isBinary = file.name.match(/\.(jpeg|jpg|png|gif|webp|mp4|webm|ogg|exe|apk)$/i);
                                
                                const readContent = new Promise((resolve, reject) => {
                                    const reader = new FileReader();
                                    reader.onload = () => resolve(reader.result);
                                    reader.onerror = () => reject(reader.error);
                                    
                                    if (isBinary) {
                                        reader.readAsDataURL(file);
                                    } else {
                                        reader.readAsText(file);
                                    }
                                });

                                const content = await readContent;

                                fileSystem["root"].children["downloads"].children[file.name] = {
                                    type: "file",
                                    content: content,
                                    isBinary: !!isBinary
                                };

                                currentPath = ["root", "downloads"];
                                print(`Successfully imported '${file.name}' into /downloads!`);
                                if (file.name.match(/\.(exe|apk)$/i)) {
                                    print(`Type 'run ${file.name}' to launch this executable.`);
                                } else {
                                    print(`Type 'ls' to view files or 'cat ${file.name}' to open it.`);
                                }
                                updatePrompt();
                            } catch (err) {
                                print("Error reading selected file.");
                            }
                        }).catch(() => {
                            print("File selection canceled.");
                        });
                    } else {
                        print("Error: File System Access API is not supported in this browser.");
                    }
                    break;

                case "clear":
                    clearTerminal();
                    break;

                default:
                    print(`Unknown command: '${cmd}'. Type 'help' for a list of commands.`);
            }
        }

        // Event listener for user input submission
        userInput.addEventListener("keydown", function(e) {
            if (e.key === "Enter") {
                let inputVal = userInput.value;
                userInput.value = "";
                if (!isAuthenticated) {
                    handleAuth(inputVal);
                } else {
                    executeCommand(inputVal);
                }
                updatePrompt();
            }
        });

        // Keep input focused when clicking anywhere on screen
        document.addEventListener("click", () => userInput.focus());

        // Initialize App
        showBootScreen();
    </script>
</body>
</html>
