<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>super-os</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-width: 320px;
            height: 100vh;
            overflow: hidden;
            background: #dfe7df;
            color: #f3f5ef;
            font-family: Arial, sans-serif;
        }
        #os-shell {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .tab-bar {
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 52px;
            padding: 8px 14px;
            background: #17231dd9;
            border-bottom: 1px solid #ffffff24;
        }
        .tab-button,
        .new-tab-button {
            min-height: 34px;
            padding: 0 16px;
            border: 1px solid transparent;
            border-radius: 7px;
            background: transparent;
            color: #dce5dc;
            font: inherit;
            cursor: pointer;
        }
        .tab-button:hover,
        .new-tab-button:hover {
            background: #ffffff12;
        }
        .tab-button.active {
            background: #314437;
            border-color: #6e8d70;
            color: #ffffff;
        }
        .new-tab-button {
            border-color: #ffffff35;
        }
        .tab-hint {
            margin-left: auto;
            color: #c4d2c4;
            font-size: 13px;
        }
        #desktop-view {
            position: relative;
            flex: 1;
            min-height: 0;
            overflow: hidden;
            background: #dfe7df;
        }
        .tree-scene {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        .tree-art {
            position: absolute;
            left: 50%;
            bottom: 0;
            width: min(100%, 72vh, 540px);
            max-height: 100%;
            height: auto;
            transform: translateX(-50%);
            filter: drop-shadow(0 8px 8px rgba(33, 75, 38, 0.12));
        }
        .desktop-title {
            position: absolute;
            z-index: 1;
            top: 28px;
            left: 30px;
            margin: 0;
            color: #ffffff;
            font-size: clamp(24px, 4vw, 42px);
            text-shadow: 0 2px 12px #16301c99;
        }
        .desktop-shortcuts {
            position: absolute;
            z-index: 1;
            top: 110px;
            left: 30px;
            display: grid;
            gap: 12px;
        }
        .desktop-shortcut {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 150px;
            padding: 10px 14px;
            border: 1px solid #ffffff88;
            border-radius: 10px;
            background: #10251c9c;
            color: #ffffff;
            font: inherit;
            text-align: left;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }
        .desktop-shortcut:hover {
            background: #10251cce;
        }
        .shortcut-icon {
            display: grid;
            width: 32px;
            height: 32px;
            place-items: center;
            border-radius: 8px;
            background: #ffffff24;
            font-weight: bold;
        }
        .desktop-caption {
            position: absolute;
            z-index: 1;
            right: 20px;
            bottom: 18px;
            color: #ffffff;
            font-size: 12px;
            text-shadow: 0 1px 5px #000000aa;
        }
        #shell-view {
            display: flex;
            flex: 1;
            min-height: 0;
            flex-direction: column;
            padding: 20px;
            overflow: auto;
            background: #0c0c0cdb;
            color: #cccccc;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 1.4;
        }
        #google-view {
            flex: 1;
            min-height: 0;
        }
        #google-frame {
            width: 100%;
            height: 100%;
            border: 0;
        }
        #terminal-output {
            white-space: pre-wrap;
            margin-bottom: 10px;
        }
        #input-line {
            display: flex;
            align-items: center;
            flex: 0 0 auto;
        }
        #prompt {
            color: #00ff00;
            white-space: pre;
            margin-right: 5px;
            flex: 0 0 auto;
        }
        #user-input {
            min-width: 0;
            background: transparent;
            border: none;
            color: #ffffff;
            font-family: inherit;
            font-size: inherit;
            flex-grow: 1;
            outline: none;
            padding: 0;
        }
        .hidden {
            display: none !important;
        }
        @media (max-width: 520px) {
            .tab-bar {
                gap: 4px;
                padding: 7px;
            }
            .tab-button,
            .new-tab-button {
                padding: 0 10px;
            }
            .tab-hint {
                display: none;
            }
            #shell-view {
                padding: 14px 10px;
            }
        }
    </style>
</head>
<body>

    <div id="os-shell">
        <nav class="tab-bar" role="tablist" aria-label="OS windows">
            <button class="tab-button active" id="desktop-tab" type="button" role="tab" aria-selected="true" aria-controls="desktop-view" data-view="desktop">Desktop</button>
            <button class="tab-button" id="shell-tab" type="button" role="tab" aria-selected="false" aria-controls="shell-view" data-view="shell">Shell</button>
            <button class="tab-button hidden" id="google-tab" type="button" role="tab" aria-selected="false" aria-controls="google-view" data-view="google">Google</button>
            <button class="new-tab-button" id="new-tab" type="button" title="Open Google in the OS">+ New tab</button>
            <span class="tab-hint">Choose Shell to open the terminal</span>
        </nav>
        <main id="desktop-view" role="tabpanel" aria-labelledby="desktop-tab">
            <div class="tree-scene" aria-hidden="true">
                <svg class="tree-art" viewBox="0 0 400 380" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="trunk-shade" x1="0" x2="1" y1="0" y2="0">
                            <stop stop-color="#34752c"/>
                            <stop offset=".48" stop-color="#286522"/>
                            <stop offset="1" stop-color="#174b20"/>
                        </linearGradient>
                        <linearGradient id="canopy-shade" x1=".15" x2=".82" y1="0" y2="1">
                            <stop stop-color="#a1b94c"/>
                            <stop offset=".48" stop-color="#719b38"/>
                            <stop offset="1" stop-color="#36772b"/>
                        </linearGradient>
                        <clipPath id="canopy-clip">
                            <path d="M88 222C68 216 55 199 61 181 43 168 47 148 62 139 49 120 59 101 78 96 70 77 89 59 109 64 116 43 138 37 155 50 164 25 190 20 207 39 224 27 245 35 252 52 274 44 292 58 290 76 314 73 329 90 319 107 339 120 334 139 318 149 330 166 321 184 304 190 310 208 294 222 274 219 255 232 231 226 211 218 190 233 163 231 145 219 124 230 103 230 88 222Z"/>
                        </clipPath>
                    </defs>
                    <ellipse cx="198" cy="362" rx="120" ry="12" fill="#4a8a38" opacity=".22"/>
                    <path d="M146 354C150 316 153 271 158 224 160 204 148 191 129 179 112 169 102 155 99 139 111 155 127 164 145 173 158 180 165 188 169 198L173 157C174 142 169 128 160 113 176 128 184 144 185 161L188 197C197 180 212 167 232 156 247 148 257 135 263 120 262 143 252 162 236 174 217 188 200 200 197 222 202 268 208 313 213 354Z" fill="url(#trunk-shade)" stroke="#286426" stroke-width="2" stroke-linejoin="round"/>
                    <path d="M148 351C125 351 100 356 78 364 107 371 145 372 184 371 220 372 254 370 279 364 257 356 234 351 211 351Z" fill="#2f7329"/>
                    <path d="M88 222C68 216 55 199 61 181 43 168 47 148 62 139 49 120 59 101 78 96 70 77 89 59 109 64 116 43 138 37 155 50 164 25 190 20 207 39 224 27 245 35 252 52 274 44 292 58 290 76 314 73 329 90 319 107 339 120 334 139 318 149 330 166 321 184 304 190 310 208 294 222 274 219 255 232 231 226 211 218 190 233 163 231 145 219 124 230 103 230 88 222Z" fill="url(#canopy-shade)"/>
                    <g clip-path="url(#canopy-clip)" opacity=".55">
                        <circle cx="92" cy="97" r="44" fill="#b3c85b"/>
                        <circle cx="158" cy="74" r="43" fill="#a5bd50"/>
                        <circle cx="229" cy="77" r="42" fill="#91ae43"/>
                        <circle cx="295" cy="112" r="40" fill="#6d9a37"/>
                        <circle cx="77" cy="158" r="42" fill="#78a33b"/>
                        <circle cx="132" cy="150" r="49" fill="#87a940"/>
                        <circle cx="202" cy="143" r="48" fill="#749b38"/>
                        <circle cx="272" cy="158" r="48" fill="#5f9032"/>
                        <circle cx="118" cy="207" r="39" fill="#5e9232"/>
                        <circle cx="244" cy="204" r="39" fill="#4b842d"/>
                    </g>
                    <g fill="#d2d86c" stroke="#f0edb0" stroke-width="2" stroke-linejoin="round">
                        <path d="M91 104C118 113 143 136 163 164 144 159 124 147 106 133Z"/>
                        <path d="M251 103C231 119 216 141 204 166 223 160 239 148 253 132Z"/>
                        <path d="M174 139C171 166 176 194 188 220 199 195 199 170 191 146Z"/>
                    </g>
                    <g fill="none" stroke="#eef0bd" stroke-linecap="round" stroke-width="1.5" opacity=".72">
                        <path d="M99 110C122 127 142 145 157 160"/>
                        <path d="M246 109C229 126 218 145 209 160"/>
                        <path d="M181 148C183 171 186 192 188 210"/>
                    </g>
                </svg>
            </div>
            <h1 class="desktop-title">super-os</h1>
            <div class="desktop-shortcuts" aria-label="Desktop shortcuts">
                <button class="desktop-shortcut" id="google-shortcut" type="button">
                    <span class="shortcut-icon" aria-hidden="true">G</span>
                    <span>Google</span>
                </button>
                <button class="desktop-shortcut" type="button" data-view="shell">
                    <span class="shortcut-icon" aria-hidden="true">&gt;_</span>
                    <span>Shell</span>
                </button>
            </div>
            <div class="desktop-caption">Tree desktop</div>
        </main>
        <section id="shell-view" class="hidden" role="tabpanel" aria-labelledby="shell-tab">
            <div id="terminal-output"></div>
            <div id="input-line">
                <span id="prompt"></span>
                <input type="text" id="user-input" autocomplete="off" spellcheck="false" aria-label="Shell command">
            </div>
        </section>
        <section id="google-view" class="hidden" role="tabpanel" aria-labelledby="google-tab">
            <iframe id="google-frame" title="Google" src="https://www.google.com/webhp?igu=1"></iframe>
        </section>
    </div>

    <script>
        // Prevent space bar from scrolling page
        window.addEventListener("keydown", function (e) {
            if (
                e.key === " " ||
                e.code === "Space" ||
                e.keyCode === 32
            ) {
                if (document.activeElement !== userInput) {
                    e.preventDefault();
                }
            }
        });

        // Global variables & state
        const VALID_USERNAME = "gabeee";
        const VALID_PASSWORD = "6655";
        let loginAttempts = 5;
        let isBooted = false;
        let isAuthenticated = false;
        let isEnteringPassword = false;
        let currentUsernameInput = "";

        // Virtual File System State
        let currentPath = ["root"];
        const fileSystem = {
            "root": {
                type: "dir",
                children: {
                    "readme.txt": { type: "file", content: "Welcome to Mini-JS-OS! This is a browser-simulated file." }
                }
            }
        };

        const outputDiv = document.getElementById("terminal-output");
        const promptSpan = document.getElementById("prompt");
        const userInput = document.getElementById("user-input");
        const desktopView = document.getElementById("desktop-view");
        const shellView = document.getElementById("shell-view");
        const viewElements = {
            desktop: desktopView,
            shell: shellView,
            google: document.getElementById("google-view")
        };
        const viewTabs = {
            desktop: document.getElementById("desktop-tab"),
            shell: document.getElementById("shell-tab"),
            google: document.getElementById("google-tab")
        };

        function selectView(view) {
            for (const [name, element] of Object.entries(viewElements)) {
                const isSelected = name === view;
                element.classList.toggle("hidden", !isSelected);
                viewTabs[name].classList.toggle("active", isSelected);
                viewTabs[name].setAttribute("aria-selected", String(isSelected));
            }

            if (view === "google") {
                viewTabs.google.classList.remove("hidden");
            }

            if (view === "shell") {
                if (!isBooted) showBootScreen();
                userInput.focus();
            } else {
                userInput.blur();
            }
        }

        document.querySelectorAll("[data-view]").forEach(button => {
            button.addEventListener("click", () => selectView(button.dataset.view));
        });

        document.getElementById("new-tab").addEventListener("click", () => {
            selectView("google");
        });

        document.getElementById("google-shortcut").addEventListener("click", () => {
            selectView("google");
        });

        function print(text = "") {
            outputDiv.textContent += text + "\n";
            shellView.scrollTop = shellView.scrollHeight;
        }

        function clearTerminal() {
            outputDiv.textContent = "";
        }

        function getVirtualDir(pathArray) {
            let current = fileSystem;
            for (let folder of pathArray) {
                if (current[folder] && current[folder].type === "dir") {
                    current = current[folder].children;
                } else {
                    return null;
                }
            }
            return current;
        }

        function getCWDString() {
            return "/" + currentPath.slice(1).join("/");
        }

        function updatePrompt() {
            if (!isBooted || !isAuthenticated) {
                promptSpan.textContent = "";
                return;
            }
            promptSpan.textContent = `mini-os:${getCWDString()}> `;
        }

        function showBootScreen() {
            print("=".repeat(55));
            print("  __  __ _        _        ____    ____  ");
            print(" |  \\/  (_)_ __ (_)      / __ \\ / ___| ");
            print(" | |\\/| | | '_ \\| |_____| |  | |\\___ \\ ");
            print(" | |  | | | | | | |_____| |__| | ___) |");
            print(" |_|  |_|_|_| |_|_|      \\____/ |____/ ");
            print("=".repeat(55));
            print(" Mini-JS-OS Version: 1.8.0");
            print(` Host Machine Kernel : Web Browser (${navigator.platform})`);
            print(` System Time         : ${new Date().toLocaleString()}`);
            print("-".repeat(55));
            print(" Boot Sequence Completed successfully.");
            print("=".repeat(55) + "\n");
            
            isBooted = true;
            print("--- SYSTEM AUTHENTICATION REQUIRED ---");
            print("Username: ");
            userInput.type = "text";
        }

        function showLockoutScreen() {
            const tuxArt = [
                "##########**************************##########",
                "######***************%%%%%**************######",
                "###*****************#%%%#@@****************###",
                "##****************+++==+=%@*****************##",
                "#*********++++++++++*=--=%@#*+++++++*********#",
                "********++++++++++*%#::::+%%#*++++++++********",
                "******+++++++++++*%#:....+%%@#++++++++++******",
                "********+++++++++*%=::..=%%%@%++++++++********",
                "#*********++++++=*@#::::*%%%#@++++++*********#",
                "##*************+====+===+*+==*+*************##",
                "####*************++++@@@#++++++***********####",
                "######**************#%@@%++**#**********######",
                "##########**************************##########"
            ];
            
            print("\n" + "!".repeat(46));
            print(" ".repeat(14) + "SYSTEM LOCKED!");
            print(" ".repeat(7) + "Too many failed login attempts.");
            print(" ".repeat(11) + "PLEASE CONTACT OWNER.");
            print("!".repeat(46) + "\n");
            
            tuxArt.forEach(line => print(line));
            print();
            
            // Disable terminal completely
            document.getElementById("input-line").classList.add("hidden");
            userInput.blur();
        }

        function handleAuth(input) {
            if (!isEnteringPassword) {
                currentUsernameInput = input.trim();
                print(currentUsernameInput);
                isEnteringPassword = true;
                print("Password: ");
                userInput.type = "password"; 
            } else {
                let password = input.trim();
                isEnteringPassword = false;
                userInput.type = "text";

                if (currentUsernameInput === VALID_USERNAME && password === VALID_PASSWORD) {
                    print("\nAccess Granted. Welcome back, Gabeee!\n");
                    print("Type 'help' for available commands or 'exit' to quit.\n");
                    isAuthenticated = true;
                    updatePrompt();
                } else {
                    loginAttempts--;
                    print("\n[!] Invalid credentials. Access Denied.");
                    if (loginAttempts > 0) {
                        print(`You have ${loginAttempts} attempt(s) remaining.\n`);
                        print("Username: ");
                    } else {
                        showLockoutScreen();
                    }
                }
            }
        }

        function executeCommand(commandLine) {
            print(promptSpan.textContent + commandLine);
            let trimmed = commandLine.trim();
            if (!trimmed) return;

            let parts = trimmed.split(/\s+/);
            let cmd = parts[0].toLowerCase();
            let args = parts.slice(1);

            let currentDirItems = getVirtualDir(currentPath);

            switch(cmd) {
                case "exit":
                    print("Shutting down Mini-JS-OS. Goodbye!");
                    document.getElementById("input-line").classList.add("hidden");
                    break;

                case "help":
                    print("Available commands:");
                    print("  help           - Show this help message");
                    print("  pwd            - Print current working directory");
                    print("  ls             - List files and folders");
                    print("  cd <dir>       - Change directory");
                    print("  mkdir <name>   - Create a new directory");
                    print("  cat <file>     - Read and display a text file");
                    print("  search_engine  - Open Google in your web browser");
                    print("  open_downloads - Pull up your Chromebook's system file manager");
                    print("  clear          - Clear the starting screen / terminal screen");
                    print("  exit           - Exit the mini OS shell");
                    break;

                case "pwd":
                    print(getCWDString());
                    break;

                case "ls":
                    Object.keys(currentDirItems).forEach(item => {
                        let suffix = currentDirItems[item].type === "dir" ? "/" : "";
                        print("  " + item + suffix);
                    });
                    break;

                case "cd":
                    if (args.length === 0) {
                        print("Error: 'cd' requires a path argument.");
                    } else {
                        let target = args.join(" ");
                        if (target === "..") {
                            if (currentPath.length > 1) currentPath.pop();
                        } else if (currentDirItems[target] && currentDirItems[target].type === "dir") {
                            currentPath.push(target);
                        } else {
                            print(`Error: Directory '${target}' not found.`);
                        }
                    }
                    break;

                case "mkdir":
                    if (args.length === 0) {
                        print("Error: 'mkdir' requires a directory name.");
                    } else {
                        let dirName = args.join(" ");
                        if (currentDirItems[dirName]) {
                            print(`Error: '${dirName}' already exists.`);
                        } else {
                            currentDirItems[dirName] = { type: "dir", children: {} };
                            print(`Directory '${dirName}' created.`);
                        }
                    }
                    break;

                case "cat":
                    if (args.length === 0) {
                        print("Error: 'cat' requires a file name.");
                    } else {
                        let fileName = args.join(" ");
                        if (currentDirItems[fileName] && currentDirItems[fileName].type === "file") {
                            print(currentDirItems[fileName].content);
                        } else {
                            print(`Error: File '${fileName}' not found.`);
                        }
                    }
                    break;

                case "search_engine":
                    print("Opening Google in your web browser...");
                    window.open("https://google.com", "_blank");
                    break;

                case "open_downloads":
                    print("Opening your Chromebook's file manager...");
                    window.open("chrome://file-manager", "_blank");
                    break;

                case "clear":
                    clearTerminal();
                    break;

                default:
                    print(`Unknown command: '${cmd}'. Type 'help' for a list of commands.`);
            }
        }

        // Event listener for user input submission
        userInput.addEventListener("keydown", function(e) {
            if (e.key === "Enter") {
                let inputVal = userInput.value;
                userInput.value = "";
                if (!isAuthenticated) {
                    handleAuth(inputVal);
                } else {
                    executeCommand(inputVal);
                }
                updatePrompt();
            }
        });

        // Start on the desktop; the shell boots only when its tab is opened.
    </script>
</body>
</html>
